name: Tests

# Runs on every push and pull request.  None of these need a camera or a
# display, so they gate the thing that is otherwise hard to check: that VRHEED
# behaves the same on Windows as it does on the developer's Mac.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Analysis self-checks
        run: python test_analysis.py

      # Qt needs a platform plugin even to build widgets; the Linux runner has
      # no xcb, and offscreen is what every suite wants anyway.
      - name: GUI smoke test (file-analysis mode, no camera)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python test_app_smoke.py

      # NOT run with VRHEED_NO_CAMERA_SCAN: this suite installs its own fake
      # backends and needs the real discovery path to find them.  It includes
      # a stubbed PySpin that checks the whole FLIR sequence.
      - name: Camera backends (includes a stubbed FLIR Blackfly)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python test_cameras.py

      # Deliberately WITH the real scan: this is the one place the USB probe
      # runs on Windows, and "does it terminate" is what we want to know.
      # timeout-minutes above turns a hang into a failure instead of a stall.
      - name: Camera diagnostic runs and reports honestly
        run: python vrheed_cameras.py

      - name: App starts headless (same check the release build uses)
        run: python main.py --check

      # The launcher picks an interpreter and re-execs into it.  A runner has
      # no PySpin anywhere, so this exercises the fallback path: explain, then
      # start anyway in file-analysis mode.
      - name: Launcher starts the app
        run: python launch.py --check

  # VRHEED itself runs on numpy 1 and numpy 2.  This job is what keeps it that
  # way: numpy 2.0 removed the ndarray.ptp() METHOD, and because the call sat
  # inside a broad `except Exception` the Gaussian profile fit silently
  # degraded to the half-max estimate -- correct-looking numbers, quietly worse,
  # no error.  Pinning alone would have hidden that; this catches the next one.
  forward-compat-numpy2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install with numpy 2
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --upgrade "numpy>=2"
          python -c "import numpy; print('numpy', numpy.__version__)"
      - name: Analysis self-checks
        run: python test_analysis.py
      - name: Camera backends
        env:
          QT_QPA_PLATFORM: offscreen
        run: python test_cameras.py
